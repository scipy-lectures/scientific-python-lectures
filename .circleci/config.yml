version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.13

    steps:
      - checkout

      - restore_cache:
          keys:
            - uv-cache-v1

      - run:
          name: Install uv
          command: pip install --user uv

      - run:
          name: Install Python dependencies
          command: make env

      - save_cache:
          key: uv-cache-v1
          paths:
            - ~/.cache/uv

      - run:
          name: Build docs
          command: |
            # NOTE: bad interaction w/ blas multithreading on circleci
            export OMP_NUM_THREADS=1
            make web  # FIX: check that failing examples produce failure

      - store_artifacts:
          path: _build/html

workflows:
  build_prs:
    jobs:
      - build:
          filters:
            branches:
              ignore: main
